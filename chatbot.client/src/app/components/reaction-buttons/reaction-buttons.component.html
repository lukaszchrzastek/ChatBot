<button mat-button class="like-button" color="primary" (click)="onLike()">
  <mat-icon
    [ngClass]="{
      'active-icon': reaction === ReactionType.Like,
      'inactive-icon': reaction !== ReactionType.Like,
      'pulse-icon': isPulsingLike,
    }"
    >thumb_up</mat-icon
  >
  Lubię
</button>

<button mat-button class="dislike-button" color="warn" (click)="onDislike()">
  <mat-icon
    [ngClass]="{
      'active-icon': reaction === ReactionType.Dislike,
      'inactive-icon': reaction !== ReactionType.Dislike,
      'pulse-icon': isPulsingDislike,
    }"
    >thumb_down</mat-icon
  >
  Nie lubię
</button>
